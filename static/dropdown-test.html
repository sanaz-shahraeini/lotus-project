<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست منوی تنظیمات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        
        .sidebar {
            width: 200px;
            background-color: #4f46e5;
            color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .settings-container {
            position: relative;
            margin-bottom: 10px;
        }
        
        .settings-toggle {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 10px;
            width: 100%;
            text-align: right;
        }
        
        .settings-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            background-color: white;
            width: 200px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 100;
            display: none;
        }
        
        .settings-dropdown a {
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            color: #333;
        }
        
        .settings-dropdown a:hover {
            background-color: #f0f0f0;
        }
        
        .icon {
            margin-left: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>تست منوی تنظیمات</h3>
        
        <div class="settings-container">
            <button type="button" id="show-settings" class="settings-toggle">
                <span class="icon">⚙️</span> تنظیمات
            </button>
            
            <div id="dropdownmenu" class="settings-dropdown">
                <a href="#user"><span class="icon">👤</span> تنظیمات عمومی کاربر</a>
                <a href="#system"><span class="icon">🔧</span> تنظیمات سیستمی</a>
            </div>
        </div>
    </div>

    <script>
        // Simple dropdown functionality
        document.addEventListener('DOMContentLoaded', function() {
            const settingsBtn = document.getElementById('show-settings');
            const dropdown = document.getElementById('dropdownmenu');
            
            settingsBtn.addEventListener('click', function() {
                console.log("Settings button clicked");
                
                if (dropdown.style.display === 'block') {
                    dropdown.style.display = 'none';
                } else {
                    dropdown.style.display = 'block';
                }
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#show-settings') && 
                    !e.target.closest('#dropdownmenu')) {
                    dropdown.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
