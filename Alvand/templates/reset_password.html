{% extends 'base.html' %}
{% block title %}بازنشانی رمز عبور{% endblock %}
{% block content %}
<form method="post">
    {% csrf_token %}
    <input type="text" name="code" placeholder="کد بازنشانی" required>
    <input type="password" name="new_password" placeholder="رمز جدید" required>
    <input type="password" name="confirm_password" placeholder="تکرار رمز" required>
    <button type="submit">بازنشانی</button>
</form>
{% endblock %}
