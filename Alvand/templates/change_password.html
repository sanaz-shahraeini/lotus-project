{% extends 'base.html' %}
{% block title %}تغییر رمز عبور{% endblock %}
{% block content %}
<form method="post">
    {% csrf_token %}
    <input type="password" name="new_password" placeholder="رمز عبور جدید" required>
    <input type="password" name="confirm_password" placeholder="تکرار رمز عبور" required>
    <button type="submit">تغییر رمز</button>
</form>
{% endblock %}
